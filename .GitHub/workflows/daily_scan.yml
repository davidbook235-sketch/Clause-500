name: Daily Nifty500 Scan

on:
  schedule:
    - cron: "10 10 * * 1-5"   # ~15:40 IST, Mon-Fri (market close ke baad)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_scan.py
      - name: Commit results
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/latest_scan.csv
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push
